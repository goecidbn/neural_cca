[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neural-cca"
version = "0.1.2"
description = "Spike sorting, spike train statistics, and orientation selectivity analysis for extracellular recordings"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
classifiers = [
	"License :: OSI Approved :: GNU Affero General Public License v3",
	"Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
]   
authors = [{name = "FSchwarz, CIDBN"}]
keywords = ["neuroscience", "spike-sorting", "orientation-selectivity", "extracellular"]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "matplotlib>=3.6",
    # tomllib is stdlib in 3.11+; fall back to the tomli backport on 3.10.
    # Used by neural_cca/__init__.py to read the version from pyproject
    # for editable installs that don't go through the metadata API.
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
batch = ["xarray>=2022.6", "zarr>=2.12"]
test = ["pytest>=7.0", "pytest-cov"]
docs = ["sphinx>=6.0", "pydata-sphinx-theme>=0.14", "sphinx-design", "numpydoc", "myst-parser", "tomli>=1.1; python_version < '3.11'"]
dev = ["ruff>=0.4"]
all = [
    "xarray>=2022.6",
    "zarr>=2.12",
    "pytest>=7.0",
    "pytest-cov",
    "sphinx>=6.0",
    "pydata-sphinx-theme>=0.14",
    "sphinx-design",
    "numpydoc",
    "myst-parser",
    "tomli>=1.1; python_version < '3.11'",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/goecidbn/neural_cca"
Documentation = "https://goecidbn.github.io/neural_cca/"

[tool.ruff]
line-length = 100
# Match the lowest supported runtime (`requires-python = ">=3.10"`) so
# ruff never suggests syntax (e.g. PEP 695 type aliases) that 3.10
# users cannot adopt.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N"]
# Scientific code follows mathematical notation for variable/argument names
# (e.g. `A`, `R0`, `X`, `Y`); the pep8-naming checks (N803, N806) would force
# rewriting equations into lowercase and obscure the math.
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# Public-API barrel file — every name is a deliberate re-export.
"neural_cca/__init__.py" = ["F401"]
# Notebooks: relaxed line length, allow unused imports in demo cells,
# allow whitespace-only blank lines (preserved by Jupyter cell rendering),
# allow per-cell imports that aren't all at the top.
"examples/*.ipynb" = [
    "E501", "F401", "F811", "F841", "W293", "E402", "E702", "E401", "F541", "I001",
]
# Tests: allow long assertion messages and imports that follow
# pytest.importorskip() guards.
"tests/*.py" = ["E501", "E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v"
# Silence external-library deprecation warnings that would otherwise
# bury our own test signal.  Matplotlib's font-config parser raises
# ~12 ``PyparsingDeprecationWarning``s the first time a plot is built;
# they are not actionable from this package.
filterwarnings = [
    "ignore::DeprecationWarning:matplotlib",
    "ignore::DeprecationWarning:pyparsing",
]

[tool.hatch.build.targets.wheel]
packages = ["neural_cca"]
