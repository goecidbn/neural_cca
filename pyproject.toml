[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neural-cca"
version = "0.1.0"
description = "Spike sorting, spike train statistics, and orientation selectivity analysis for extracellular recordings"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
classifiers = [
	"License :: OSI Approved :: GNU Affero General Public License v3",
	"Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
]   
authors = [{name = "FSchwarz, CIDBN"}]
keywords = ["neuroscience", "spike-sorting", "orientation-selectivity", "extracellular"]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
batch = ["xarray>=2022.6", "zarr>=2.12"]
test = ["pytest>=7.0", "pytest-cov"]
docs = ["sphinx>=6.0", "pydata-sphinx-theme>=0.14", "sphinx-design", "numpydoc", "myst-parser", "tomli>=1.1; python_version < '3.11'"]
dev = ["ruff>=0.4"]
all = [
    "xarray>=2022.6",
    "zarr>=2.12",
    "pytest>=7.0",
    "pytest-cov",
    "sphinx>=6.0",
    "pydata-sphinx-theme>=0.14",
    "sphinx-design",
    "numpydoc",
    "myst-parser",
    "tomli>=1.1; python_version < '3.11'",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/goecidbn/neural_cca"
Documentation = "https://goecidbn.github.io/neural_cca/"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v"

[tool.hatch.build.targets.wheel]
packages = ["neural_cca"]
